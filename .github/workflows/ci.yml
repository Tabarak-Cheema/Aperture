name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python / lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --only-binary=:all: -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          APERTURE_HOME: /tmp/ci-aperture
        run: pytest -q --maxfail=1 --disable-warnings

  web:
    name: web / build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npm run build

  budget:
    name: token budget enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --prefer-binary --only-binary=:all: -r requirements.txt
      - run: pytest packages/llm_gateway/tests/test_prompt_budget.py -q

  isolation:
    name: render-path isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install --prefer-binary --only-binary=:all: -r requirements.txt
      - run: pytest apps/server/tests/test_isolation.py -q
